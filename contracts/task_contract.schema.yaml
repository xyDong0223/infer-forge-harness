$schema: https://json-schema.org/draft/2020-12/schema
title: Kunlun Inference Task Contract
type: object
required:
  - api_version
  - kind
  - metadata
  - context
  - actions
  - acceptance
properties:
  api_version:
    type: string
    pattern: '^infer\\.kunlun/v[0-9]+(alpha|beta)[0-9]+$'
  kind:
    const: Task
  metadata:
    type: object
    required: [name, task_type]
    properties:
      name: {type: string, minLength: 1}
      task_type: {type: string, minLength: 1}
  context:
    type: object
    required: [model, target]
    properties:
      model: {type: object}
      target: {type: object}
      repository: {type: object}
  actions:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  acceptance:
    type: object
    minProperties: 1
  artifacts:
    type: array
    items: {type: string}
  exit_states:
    type: object
additionalProperties: false
