$schema: https://json-schema.org/draft/2020-12/schema
title: Kunlun Inference Task Contract
type: object
required:
  - api_version
  - kind
  - metadata
  - context
  - actions
  - acceptance
properties:
  api_version:
    type: string
    pattern: '^infer\.kunlun/v[0-9]+(alpha|beta)[0-9]+$'
  kind:
    const: Task
  metadata:
    type: object
    required: [name, task_type]
    properties:
      name: {type: string, minLength: 1}
      task_type: {type: string, minLength: 1}
      version: {type: string}
      owner: {type: string}
  context:
    type: object
    required: [model, target]
    properties:
      model: {type: object}
      target: {type: object}
      repository: {type: object}
      software: {type: object}
      server: {type: object}
      input_artifact: {type: string}
  actions:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  acceptance:
    type: object
    minProperties: 1
  # `execution` and `checks` are optional in a template but required before a
  # Runner may leave PLAN_ONLY: they carry the cluster-side identity and the
  # observable evidence a Validator will judge.
  execution:
    type: object
    required: [mode, namespace, resource_name]
    properties:
      mode: {enum: [plan_only, execute]}
      namespace: {type: string, minLength: 1}
      resource_name: {type: string, minLength: 1}
      manifest: {type: string}
      startup_timeout_seconds: {type: integer, minimum: 1}
      health_interval_seconds: {type: integer, minimum: 1}
      health_successes_required: {type: integer, minimum: 1}
      retain_on_failure: {type: boolean}
      commands:
        type: object
        properties:
          install: {type: array, items: {type: string}}
          setup: {type: array, items: {type: string}}
          serve: {type: array, items: {type: string}}
  checks:
    type: object
    properties:
      health:
        type: object
        required: [path, expected_status]
        properties:
          path: {type: string, minLength: 1}
          expected_status: {type: integer}
      chat:
        type: object
        required: [path]
        properties:
          path: {type: string, minLength: 1}
          method: {type: string}
          expected_non_empty_text: {type: boolean}
          payload: {type: object}
      backend:
        type: object
        properties:
          expected: {type: string}
          reject_unexpected_fallback: {type: boolean}
  artifacts:
    oneOf:
      - type: array
        items: {type: string}
      - type: object
        required: [directory]
        properties:
          directory: {type: string, minLength: 1}
          collect: {type: array, items: {type: string}}
  exit_states:
    type: object
additionalProperties: false
