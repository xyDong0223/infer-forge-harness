$schema: https://json-schema.org/draft/2020-12/schema
title: Harness post-execution efficiency accounting
type: object
required: [schema_version, evaluator_version, status, run, window, outcome, metrics, stages,
           worker_attempts, graph_blocks, findings, warnings, limitations, provenance]
properties:
  schema_version: {const: 1}
  evaluator_version: {const: 1}
  status: {const: RECORDED}
  run:
    type: object
    required: [run_id, model_id, model_revision, plugin_revision, backend, evidence_mode, artifact_root]
    properties:
      run_id: {type: string, minLength: 1}
      evidence_mode: {enum: [real, simulation]}
  window:
    type: object
    required: [started_at, ended_at, scope, endpoint]
    properties:
      started_at: {type: number}
      ended_at: {type: number}
      scope: {enum: [completed, snapshot]}
      endpoint: {const: last_persisted_event}
  outcome:
    type: object
    required: [graph_status, reason_code, delivery_state]
  metrics:
    type: object
    required: [elapsed_seconds, recorded_wall_seconds, unobserved_wall_seconds, worker_attempts,
               worker_retries, failed_worker_attempts, unclosed_worker_attempts, diagnosis_attempts,
               graph_executions, graph_reuses, graph_bookkeeping_blocks, repeated_graph_executions, known_queue_wait_seconds,
               unknown_queue_wait_count, token_usage, model_call_count, cost, device_utilization]
    properties:
      token_usage: {type: 'null'}
      model_call_count: {type: 'null'}
      cost: {type: 'null'}
      device_utilization: {type: 'null'}
    additionalProperties: {type: number, minimum: 0}
  stages:
    type: array
    items:
      type: object
      required: [source, stage, count, closed_interval_seconds, unclosed_count, references]
      properties:
        source: {enum: [graph, graph_reuse, graph_bookkeeping, worker]}
        stage: {type: string}
        count: {type: integer, minimum: 1}
        closed_interval_seconds: {type: number, minimum: 0}
        unclosed_count: {type: integer, minimum: 0}
        references: {type: array, minItems: 1, items: {type: string}}
  worker_attempts:
    type: array
    items:
      type: object
      required: [task_id, stage, attempt, started_at, finished_at, duration_seconds, outcome, event_ids,
                 queue_wait_seconds, queue_event_id]
      properties:
        outcome: {enum: [succeeded, failed, unclosed]}
        duration_seconds: {type: [number, 'null'], minimum: 0}
        queue_wait_seconds: {type: [number, 'null'], minimum: 0}
        event_ids: {type: array, minItems: 1, items: {type: string}}
  graph_blocks: {type: array, items: {type: object}}
  findings:
    type: array
    items:
      type: object
      required: [code, message, references]
      properties:
        references: {type: array, minItems: 1, items: {type: string}}
  warnings: {type: array, items: {type: string}}
  limitations: {type: array, items: {type: string}}
  provenance:
    type: object
    required: [snapshot_path, snapshot_sha256, validation_path]
    properties:
      snapshot_path: {type: string}
      snapshot_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      validation_path: {type: string}
