$schema: https://json-schema.org/draft/2020-12/schema
title: P1 interactive Graph decision body
description: CLI supplies run/handoff/decision IDs and expected source_version separately. engine/interaction.py enforces identity, hashes, allowed parameters and durable budget.
type: object
additionalProperties: false
required: [next_action, diagnosis, evidence_refs]
properties:
  next_action: {enum: [RETRY, RETRY_WITH_PARAMS, BLOCKED]}
  diagnosis: {type: string, minLength: 1}
  facts: {type: array, items: {type: string, minLength: 1}}
  hypotheses: {type: array, items: {type: string, minLength: 1}}
  confidence: {type: number, minimum: 0, maximum: 1}
  evidence_refs:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  params:
    type: object
    additionalProperties: false
    properties:
      proof_health_interval:
        description: Only for environment_proof/service_proof when declared in context; runtime validator requires a finite nonnegative numeric value.
        type: number
        minimum: 0
allOf:
  - if:
      properties: {next_action: {enum: [RETRY, BLOCKED]}}
    then:
      properties: {params: {maxProperties: 0}}
  - if:
      properties: {next_action: {const: RETRY_WITH_PARAMS}}
    then:
      required: [params]
      properties: {params: {minProperties: 1}}
