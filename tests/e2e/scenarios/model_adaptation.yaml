schema_version: 1
capability: model_adaptation
workflow: workflows/model_adaptation.yaml
entrypoint: cli/workflow/graph.py
tiers:
  local:
    required: true
    evidence_mode: simulation
    test: tests/e2e/test_model_adaptation.py
    cases:
      - test_preplan_failure_is_preserved_for_triage_and_restart
      - test_graph_rejects_owner_change_without_mutating_plan_or_environment
      - test_graph_rejects_manual_deployment_contract
      - test_environment_user_id_input_and_restart
      - test_environment_drift_blocks_before_intake_and_resumes_same_pod
      - test_model_adaptation_delivers_after_validated_workers
      - test_scoped_claim_preserves_other_run_and_rejects_wrong_identity
      - test_context_is_readonly_and_restores_graph_from_saved_inputs
      - test_missing_worker_evidence_blocks_delivery
      - test_pre_operator_service_cannot_certify_delivery
      - test_fresh_service_cannot_reuse_pre_operator_accuracy
      - test_resume_preserves_attempts_and_rejects_old_lease
      - test_environment_tampering_blocks_resume
      - test_incomplete_operator_report_is_blocked
      - test_simulation_proof_cannot_unlock_real_run
    additional_tests:
      - test: tests/e2e/test_codex_interaction.py
        cases:
          - test_codex_nonblocking_decision_restart_and_delivery
          - test_codex_stale_and_conflicting_decisions_are_rejected
          - test_codex_source_evidence_change_rejects_decision
          - test_codex_recovery_budget_survives_failure_and_restart
      - test: tests/e2e/test_managed_worker.py
        cases:
          - test_managed_worker_three_stage_measured_completion
          - test_managed_worker_wrong_candidate_is_rejected_without_execution
          - test_managed_worker_forged_receipt_does_not_promote
          - test_managed_worker_wrong_numerics_fail_despite_successful_processes
          - test_managed_worker_crash_after_validation_replays_before_submit
          - test_managed_worker_dead_coordinator_requires_process_and_receipt_reconciliation
          - test_unified_cli_list_preserves_completed_and_expired_tasks_across_restart
      - test: tests/e2e/test_memory_projection.py
        cases:
          - test_memory_projection_rebuild_rejection_and_graph_restart
          - test_memory_projection_preserves_failure_claims_and_pending_decision
    real_components:
      - cli
      - workflow
      - operations
      - validators
      - scheduler
      - journal
      - task_memory
      - artifact_store
    simulated_boundaries:
      - cluster_adapter
      - remote_runtime_observations
      - source_revision_resolution
      - external_operator_agents
      - external_capacity_planner
    proves: orchestration_and_persistence
    does_not_prove:
      - real_device_correctness
      - real_model_accuracy
      - throughput_or_latency
  device_smoke:
    required: false
    evidence_mode: real
    test: tests/e2e/test_model_adaptation_hardware.py
    marker: device_smoke
    authorization: INFER_FORGE_RUN_DEVICE_SMOKE
    configuration: INFER_FORGE_HARDWARE_SCENARIO
    requires: [prepared_pod, pinned_contract, existing_real_run, explicit_authorization]
  real_model:
    required: false
    evidence_mode: real
    test: tests/e2e/test_model_adaptation_hardware.py
    marker: real_model
    authorization: INFER_FORGE_RUN_REAL_MODEL
    configuration: INFER_FORGE_HARDWARE_SCENARIO
    requires:
      - prepared_pod
      - pinned_contract
      - existing_real_run
      - completed_operator_stages
      - upstream_graph_facts
      - explicit_authorization
