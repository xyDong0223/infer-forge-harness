# Test-only synthetic contract. Not a deployment input or user template.
api_version: infer.kunlun/v1alpha1
kind: Task
metadata:
  name: kdp-001-fixture-model-p800
  task_type: deployment_proof
  version: 0.1.0
  owner: fixture-owner
  evidence_mode: simulation

context:
  model:
    name: FixtureModel
    # HF-format weights on the shared model PVC.
    path: /models/fixture
    pvc: fixture-models
  target:
    hardware: Kunlunxin-3-P800
    # Scheduling granularity of the dedicated pool is a whole 8-XPU node; the
    # server itself runs TP=1, so device_count and tensor_parallel_size differ
    # on purpose.
    device_count: 8
    namespace: pd-test
    volcano_queue: fixture-queue
    dedicated_pool: fixture-pool
  runtime:
    engine: vllm
    backend: kunlun
    plugin: vllm-kunlun
  repository:
    vllm_kunlun_ref: v0.25.1-dev
  software:
    install_guide: https://github.com/baidu/vLLM-Kunlun/blob/v0.25.1-dev/docs/source/installation.md
    image: example.invalid/fixture:never-pulled
    vllm_version: 0.25.1
    torch_version: 2.9.0
  server:
    host: 0.0.0.0
    port: 8356
    served_model_name: FixtureModel
    tensor_parallel_size: 1
    max_model_len: 32768
    dtype: bfloat16

actions:
  - preflight
  - prepare_environment
  - toy_bringup_before_load
  - start_server
  - poll_health
  - run_chat_smoke
  - collect_artifacts

acceptance:
  pod_ready: true
  health_check: 200
  chat_completion: non_empty
  expected_backend: kunlun
  unexpected_fallback: false
  startup_timeout_seconds: 900

execution:
  mode: plan_only
  namespace: pd-test
  resource_name: fixture-owner-kdp001-fixture-model
  manifest: tasks/kdp-001-deployment-proof/manifests/feddeployment.template.yaml
  startup_timeout_seconds: 900
  health_interval_seconds: 10
  health_successes_required: 3
  retain_on_failure: true
  commands:
    # Authoritative recipe: docs/source/installation.md on v0.25.1-dev.
    install:
      - bash /workspace/install_vllm_kunlun.sh
    setup:
      - source /workspace/vLLM-Kunlun/setup_env.sh
    serve:
      - >-
        python -m vllm.entrypoints.openai.api_server
        --host 0.0.0.0
        --port 8356
        --model /models/fixture
        --trust-remote-code
        --max-model-len 32768
        --tensor-parallel-size 1
        --dtype bfloat16
        --served-model-name FixtureModel

checks:
  health:
    path: /health
    expected_status: 200
  chat:
    path: /v1/chat/completions
    method: POST
    expected_non_empty_text: true
    payload:
      model: FixtureModel
      messages:
        - role: user
          content: Say hello in one short sentence.
      max_tokens: 16
  backend:
    expected: kunlun
    reject_unexpected_fallback: true

artifacts:
  directory: /external/fixture-proof
  collect:
    - deployment_manifest
    - task_contract
    - pod_spec
    - environment_versions
    - install_log
    - server_log
    - health_result
    - chat_result
    - reproduce_command

exit_states:
  pass: DEPLOYMENT_READY
  install_failed: INSTALL_FAILED
  bringup_blocked: BRINGUP_BLOCKED
  startup_failed: SERVER_START_FAILED
  health_timeout: READINESS_TIMEOUT
  api_failed: API_SMOKE_FAILED
  fallback_detected: UNEXPECTED_FALLBACK
  invalid: CONTRACT_INVALID
  needs_human: NEEDS_HUMAN
