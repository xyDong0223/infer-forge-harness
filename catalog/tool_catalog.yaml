api_version: infer.kunlun/v1alpha1
kind: ToolCatalog
entries:
  - id: model_intake
    command: python3 tools/model_intake.py
    purpose: identify the model artifact and reject invalid checkpoints
    side_effect: read_only
    retryable: true
    outputs:
      - model_request.yaml
      - intake_status.json
  - id: model_scan
    command: python3 tools/scan_model_support.py
    purpose: build an evidence-backed model support card
    side_effect: read_only
    retryable: true
    outputs:
      - model_support.json
      - scan_status.json
  - id: capability_evaluation
    command: python3 tools/evaluate_capability.py
    purpose: exercise only the capability dimensions demanded by the model
    side_effect: pod_exec
    retryable: true
    outputs:
      - capability_evaluation.json
      - evaluation_status.json
  - id: accuracy_differential
    command: python3 tools/accuracy_differential.py
    purpose: compare served output against an independent reference
    side_effect: pod_exec
    retryable: true
    outputs:
      - accuracy_differential.json
      - accuracy_status.json
  - id: vendor_handoff
    command: python3 tools/vendor_handoff.py
    purpose: package an unresolved platform gap for downstream ownership
    side_effect: write_artifact
    retryable: true
    outputs:
      - handoff.json
      - handoff_status.json
  - id: deployment_proof
    command: python3 runners/task_runner.py
    purpose: prove environment or service readiness
    side_effect: cluster_write
    retryable: false
    outputs: [status.json]
  - id: capability_match
    command: python3 tools/match_capabilities.py
    purpose: match static model demands to registered capabilities
    side_effect: read_only
    retryable: true
    outputs: [capability_match.json]
  - id: gap_classification
    command: python3 tools/classify_gaps.py
    purpose: classify ownership and route unresolved gaps
    side_effect: read_only
    retryable: true
    outputs: [gap_classification.json]
  - id: instrument_kernel_trace
    command: python3 tools/instrument_kernel_trace.py
    purpose: capture arguments and tensors for a failing call
    side_effect: pod_exec
    retryable: false
    outputs: [trace.json]
  - id: apply_torch_decode_patch
    command: python3 tools/apply_torch_decode_patch.py
    purpose: place and verify a reversible torch fallback
    side_effect: pod_write
    retryable: false
    outputs: [placement_report.json]
  - id: deployment_plan
    command: python3 tools/plan_deployment.py
    purpose: derive launch parameters from recorded facts
    side_effect: write_artifact
    retryable: true
    outputs: [deployment_plan.json]
  - id: memory_budget
    command: python3 tools/memory_budget.py
    purpose: reconcile xpu_smi counters with the serving process
    side_effect: pod_exec
    retryable: true
    outputs: [memory_budget.json]
  - id: api_conformance
    command: python3 tools/check_api_conformance.py
    purpose: verify response shape and parser behavior
    side_effect: pod_exec
    retryable: true
    outputs: [api_conformance.json]
  - id: support_matrix
    command: python3 tools/update_support_matrix.py
    purpose: publish evidence-bounded support claims
    side_effect: write_artifact
    retryable: true
    outputs: [support_matrix.yaml]
  - id: tensor_diff
    command: python3 tools/tensor_diff.py
    purpose: compare candidate and reference tensors with a relative-L2 gate
    side_effect: read_only
    retryable: true
    outputs: [tensor_diff.json]
