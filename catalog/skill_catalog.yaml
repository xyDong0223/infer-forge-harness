api_version: infer.kunlun/v1alpha1
kind: SkillCatalog
entries:
  - id: model-intake
    task_types: [model_intake]
    purpose: establish the pinned, servable model identity before runtime work
    tools: [model_intake]
    verification: intake_validator
    preconditions: []
    exit_conditions: [INTAKE_READY, MODEL_UNAVAILABLE, UNSUPPORTED_FORMAT]
    rules:
      - reject mcore checkpoints and unresolved revisions
      - do not make runtime decisions during intake
  - id: environment-proof
    task_types: [deployment_proof, environment_proof, service_proof]
    purpose: prove the runtime environment and service independently
    tools: [deployment_proof]
    verification: deployment_validator
    preconditions: []
    exit_conditions: [ENVIRONMENT_READY, DEPLOYMENT_READY, NEEDS_HUMAN]
    rules:
      - require explicit execute authorization
      - require owned resources in the shared namespace
  - id: model-scanner
    task_types: [model_scan]
    purpose: inspect the pinned model and installed runtime registration
    tools: [model_scan]
    verification: scan_validator
    preconditions: [ModelRequest, EnvironmentProof]
    exit_conditions: [SCAN_READY, NEEDS_HUMAN]
    rules:
      - static evidence cannot claim runtime support
      - record unresolved architecture and dispatch assumptions
      - resolve the arch only after load_general_plugins(): plugin registration overwrites upstream at engine start, so an import-time registry check reports the upstream triton variant even when the Kunlun OOT one serves
      - recent checkpoints carry dtype instead of torch_dtype; a probe reading only the old key must not fail the identity contract
      - "a KUNLUN_OOT verdict says a Kunlun implementation is registered, not that it loads; pair every scan with the runtime-drift gate or the reassurance is unearned"
      - "scan the axes the config actually demands: a model_type carrying index_topk demands sparse attention, and reporting only attention=mla hides the dimension that owns most of the risk"
      - "derive contested config values from the weights, not the config: GLM-5.2's head_dim alias overwrote qk_rope_head_dim with 192, and kv_a_proj_with_mqa [576, 6144] against kv_lora_rank 512 proved the real value was 64"
      - "when a ported heuristic reproduces something the checkpoint also states, check it: the derived indexer pattern matched the checkpoint's own indexer_types list entry for entry, which turned an assumption into a fact"
  - id: capability-matcher
    task_types: [capability_match]
    purpose: match model demands against registered platform capabilities
    tools: [capability_match]
    verification: capability_validator
    preconditions: [ModelRequest, ModelSupportCard, EnvironmentProof]
    exit_conditions: [MATCH_READY, NEEDS_HUMAN]
    rules:
      - distinguish registry evidence from runtime evidence
      - never infer support from a module name alone
  - id: gap-triage
    task_types: [gap_classification, failure_triage]
    purpose: attribute a failure before selecting a patch or handoff
    tools: [gap_classification, instrument_kernel_trace]
    verification: triage_validator
    preconditions: [ModelSupportCard, CapabilityMatch]
    exit_conditions: [TRIAGE_READY, NEEDS_HUMAN]
    rules:
      - separate model, adapter, platform-kernel, runtime-state, and API causes
      - use a discriminating control before claiming attribution
      - enumerate the whole missing set before estimating scope; one missing symbol was read as a multi-day backend re-port when the real remainder was a base-class swap and sixty lines, and the enumeration that collapsed it took twenty seconds
      - name the layer a defect belongs to before fixing it; twelve of GLM-5.2's fourteen defects were engine-drift in the plugin, not model adaptation, and a model-file diff cannot see them
      - the first failure after a long wait is rarely the only one — prefer a pass that collects every failure over a loop that reports the first
  - id: capability-evaluation
    task_types: [capability_evaluation]
    purpose: exercise only demanded capability dimensions with independent controls
    tools: [capability_evaluation]
    verification: evaluation_validator
    preconditions: [CapabilityMatch]
    exit_conditions: [EVALUATION_PASS, EVALUATION_PARTIAL, EVALUATION_FAIL]
    rules:
      - gate with relative L2 where scale errors are possible
      - an unimplemented dimension is partial, never an implicit pass
  - id: runtime-drift-gate
    task_types: [runtime_drift_scan]
    purpose: prove the installed plugin still imports against the installed engine before anything is deployed
    tools: [runtime_drift_scan]
    verification: drift_validator
    preconditions: [EnvironmentProof]
    exit_conditions: [DRIFT_CLEAR, DRIFT_FOUND, NEEDS_HUMAN]
    rules:
      - import every module in one pass; the module that breaks is the one nobody expected on the path
      - a registry entry proves a name is mapped, never that the module behind it imports
      - resolve each missing symbol to a candidate new location, or state that it is gone; a bare failure list makes the next Task guess
      - drift is a property of the (engine, plugin) pair, not of the model — rerun after either is reinstalled, and do not rerun per model
      - "a pinned version string is not evidence of a matching install: vLLM-Kunlun v0.25.1-dev pairs with a wheel labelled 0.25.1 whose internals are months newer, and every MLA module failed to import while the label matched"
      - import success is not correctness; a module can import and still miss an abstract method
  - id: toy-bringup
    task_types: [toy_bringup]
    purpose: exercise construction, KV binding, prefill and decode at toy scale before loading real weights
    tools: [toy_bringup]
    verification: bringup_validator
    preconditions: [ModelRequest, EnvironmentProof]
    exit_conditions: [BRINGUP_PASS, BRINGUP_BLOCKED, NEEDS_HUMAN]
    rules:
      - never put a full weight load in a debug loop; contract defects do not need the weights and a 700 GiB load per attempt buys one error message
      - shrink only depth, expert count and MTP layers; keep every dimension that selects a kernel or backend, or a pass here describes a different code path
      - truncate per-layer config lists to the new depth, otherwise the config loader fails before anything interesting runs
      - "keep the quantization config: the quantized linear path is part of what is being proven"
      - require more than one decoded token; one token proves prefill only, and paged attention and the sparse indexer differ on the decode path
      - random weights cannot see a wrong scale or a mis-split head dim — a pass is a code path, never an accuracy claim
      - tp_size 1 leaves collectives uncovered; rerun at the planned TP when an all-reduce or expert dispatch is suspect
  - id: deployment-planning
    task_types: [deployment_plan]
    purpose: derive launch parameters from recorded model and gap facts
    tools: [deployment_plan]
    verification: plan_validator
    preconditions: [ModelRequest, GapClassification]
    exit_conditions: [PLAN_READY, NEEDS_HUMAN]
    rules:
      - every launch parameter needs an evidence source or explicit assumption
  - id: operator-task-dispatch
    task_types: [operator_task_dispatch]
    purpose: delegate confirmed XPU operator gaps without blocking model bring-up
    tools: [operator_task_dispatch]
    verification: operator_lifecycle_validator
    preconditions: [GapClassification]
    exit_conditions: [DISPATCHED, DISPATCH_SKIPPED, NEEDS_HUMAN]
    rules:
      - emit durable requests and let the main bring-up continue
      - never treat a generated request as an integrated implementation
      - "the torch fallback written for a dispatched gap is itself a registry input: declare it in the shim registry in the same session, or it serves un-optimised with no request and no record - three GLM-5.2 shims did exactly that"
      - "before dispatching a new operator, search the operator repo for an existing implementation: two of the three GLM-5.2 shim kernels already existed in XSpeedGate and the live paths were even calling two of them, so one dispatch produced a duplicate and two produced work for an op-gen agent that correctly answered 'already exists'"
  - id: shim-opgen-handoff
    task_types: [torch_shim_handoff]
    purpose: ensure every torch shim standing in for a vendor kernel becomes an operator request or an explicit waiver
    tools: [torch_shim_handoff]
    verification: shim_validator
    preconditions: [EnvironmentProof]
    exit_conditions: [HANDOFF_CLEAR, HANDOFF_FOUND, NEEDS_HUMAN]
    rules:
      - "a torch shim is a dispatch input, not a terminal state: register it the session it is written, with location, replaced kernel, call frequency and semantics basis"
      - the probe is a net, not ground truth; every signal it raises must be declared, dispatched or waived - an unexplained signal is the GLM-5.2 failure repeating
      - dispatch in the same pass, not later - dispatchable entries become operator_lifecycle requests immediately, so the handoff never waits on a manual step
      - "a waiver needs a reason someone can audit; glue logic and once-per-startup cost qualify, 'nobody got to it' does not"
      - a dispatched shim is not an integrated operator; it still passes MAT-025 baseline freeze and MAT-026 integration one candidate at a time
  - id: baseline-freeze
    task_types: [baseline_freeze]
    purpose: freeze a passing service and accuracy baseline for candidate regression
    tools: [baseline_freeze]
    verification: operator_lifecycle_validator
    preconditions: [DeploymentProof, AccuracyDifferential]
    exit_conditions: [BASELINE_FROZEN, BASELINE_REJECTED, NEEDS_HUMAN]
    rules:
      - require service and independent accuracy evidence
      - record environment and artifact provenance
  - id: operator-candidate-integration
    task_types: [operator_candidate_integration]
    purpose: integrate one generated operator at a time against an immutable baseline
    tools: [operator_candidate_integration]
    verification: operator_lifecycle_validator
    preconditions: [ServingBaseline]
    exit_conditions: [WAITING_FOR_CANDIDATE, READY_FOR_INTEGRATION, CANDIDATE_REJECTED]
    rules:
      - require kernel grade, actual dispatch, service regression, and accuracy regression
      - rollback on any regression
      - "a wheel built off-target is unshippable: the build host's glibc was newer than the pod's and the import failed; build inside the target pod, with a toolchain whose builtin types match the pod's SDK headers (XTDK 3.6 lacked xbfloat16 that the pod's torch_xmlir headers require) rather than whatever the host used last time"
      - "build the candidate from the exact commit the operator team ships, not local HEAD: local HEAD and the official 1.5.1 wheel had diverged, and the rebuild silently lost eight operators the official package carried - diff the op sets, never assume HEAD is a superset"
      - "verify a swapped operator package by enumerating every operator the plugin references and resolving each one by name against the new build; an op missing from BOTH old and new packages is an unused code path, not a regression, and only that comparison can tell the two apart"
      - "uninstalling an operator wheel removes every module it ships, including side-car top-level modules (the official xspeedgate_ops wheel also owned a top-level cocopod module that force-reinstall took down with it); take the old dist-info RECORD before replacing and restore anything the new build does not carry"
      - "a rebuild in a copy without git metadata versions itself 0.0.0+unknown and fails the plugin's operator-version gate; the version lives in dist-info METADATA and must be reconciled after any manual package surgery"
      - "exact equality on integer ops, on the target device, before any claim of integration: op versus the torch shim it replaces, then worker logs proving every rank took the new path, then service health and a real completion - a pass in the op repo's own test suite proves nothing about the pod"
  - id: patch-placement
    task_types: [patch_placement]
    purpose: select and verify the narrowest reversible patch placement
    tools: [apply_torch_decode_patch]
    verification: patch_validator
    preconditions: [FailureTriage]
    exit_conditions: [PATCH_PLACED, NEEDS_HUMAN]
    rules:
      - prove the patch in service and isolation
      - preserve a disable and restore path
  - id: accuracy-alignment
    task_types: [accuracy_differential]
    purpose: align served output against an independent reference
    tools: [accuracy_differential]
    verification: accuracy_validator
    preconditions: [ModelRequest, DeploymentProof]
    exit_conditions: [ACCURACY_PASS, ACCURACY_FAIL]
    rules:
      - use independent reference data
      - do not rely on cosine or norm alone
      - a reference whose top-k is identical across different prompts is broken, not the candidate; treat constant output as a reference failure control
      - transformers on CPU may ignore the compressed-tensors config of an int-quantized checkpoint (raw int8 magnitudes, NaN after the first layer); the reference must apply weight_scale tensors itself
      - checkpoint tensor keys may carry a model.language_model. prefix that the loaders flatten; map keys by both spellings before calling a module missing
  - id: memory-budget
    task_types: [memory_budget]
    purpose: reconcile P800 HBM usage against the serving process
    tools: [memory_budget]
    verification: memory_validator
    preconditions: [DeploymentProof]
    exit_conditions: [BUDGET_ACCEPTABLE, BUDGET_FAIL]
    rules:
      - server log and xpu_smi snapshot must belong to the same process
      - unknown memory remains unattributed rather than being guessed
      - reconcile per active rank only; idle cards on a shared pod are context, never scope, and a negative unattributed remainder means the wrong card was picked
      - cross-check the active-rank count against the TP size the log declares; a mismatch is recorded as a scope warning, not silently accepted
  - id: api-conformance
    task_types: [api_conformance]
    purpose: verify response shape and parser behavior separately from numerical accuracy
    tools: [api_conformance]
    verification: conformance_validator
    preconditions: [ModelRequest]
    exit_conditions: [CONFORMANT, NONCONFORMANT, PARSER_ABSENT]
    rules:
      - validate actual response markers, not registry declarations
  - id: support-release
    task_types: [support_matrix]
    purpose: publish only claims supported by the accumulated evidence
    tools: [support_matrix]
    verification: matrix_validator
    preconditions: [AccuracyDifferential]
    exit_conditions: [DELIVERED, NEEDS_HUMAN]
    rules:
      - record conditions and limitations with every validated claim
  - id: vendor-handoff
    task_types: [vendor_handoff]
    purpose: package an unresolved platform issue for downstream ownership
    tools: [vendor_handoff]
    verification: handoff_validator
    preconditions: [FailureTriage]
    exit_conditions: [HANDOFF_READY, NEEDS_HUMAN]
    rules:
      - include reproduction, ownership, evidence, and stopping point
  - id: cache-layout-validation
    task_types: [capability_evaluation, failure_triage, patch_placement]
    when: {issue: cache_layout}
    purpose: validate cache pair axes, block layout, and read-back semantics
    tools: [instrument_kernel_trace]
    verification: evaluation_validator
    preconditions: [CapabilityMatch]
    exit_conditions: [EVALUATION_PASS, EVALUATION_FAIL, NEEDS_HUMAN]
    rules:
      - infer layout from tensor shape and runtime contract, never from a similar kernel
      - test both key and value halves and include a read-back check
  - id: quantization-differential
    task_types: [capability_evaluation, accuracy_differential]
    when: {dimension: quantization}
    purpose: isolate scale, clamp, dtype, and activation quantization errors
    tools: [capability_evaluation, accuracy_differential]
    verification: evaluation_validator
    preconditions: [CapabilityMatch]
    exit_conditions: [EVALUATION_PASS, EVALUATION_FAIL]
    rules:
      - use relative L2 and an input distribution that exercises saturation
      - negative controls must distinguish scale and dtype mistakes
  - id: dispatch-verification
    task_types: [model_scan, capability_match, failure_triage]
    when: {issue: dispatch}
    purpose: verify the implementation actually selected by the serving runtime
    tools: [model_scan, instrument_kernel_trace]
    verification: scan_validator
    preconditions: [EnvironmentProof]
    exit_conditions: [SCAN_READY, TRIAGE_READY, NEEDS_HUMAN]
    rules:
      - a missing symbol does not prove the path is unreachable
      - record the selected variant and actual call site
  - id: runtime-state-triage
    task_types: [failure_triage]
    when: {issue: runtime_state}
    purpose: separate warmup, empty metadata, cache lifetime, and steady-state failures
    tools: [instrument_kernel_trace]
    verification: triage_validator
    preconditions: [DeploymentProof]
    exit_conditions: [TRIAGE_READY, NEEDS_HUMAN]
    rules:
      - reproduce both warmup and steady-state calls
      - never interpret an empty cache without checking its shape
  - id: p800-fallback-selection
    task_types: [failure_triage, patch_placement, deployment_plan]
    when: {issue: p800_kernel}
    purpose: select the fastest correct P800 implementation when a kernel cannot launch
    tools: [instrument_kernel_trace, apply_torch_decode_patch]
    verification: patch_validator
    preconditions: [FailureTriage]
    exit_conditions: [PATCH_PLACED, NEEDS_HUMAN]
    rules:
      - check launch limits before tuning kernel parameters
      - prefer a correct torch fallback over repeated futile Triton tuning
  - id: model-bringup-loop
    task_types: [model_bringup_loop]
    purpose: drive model bring-up through the cheapest evidence-backed correction loop
    tools: [deployment_proof, instrument_kernel_trace, apply_torch_decode_patch]
    verification: deployment_validator
    preconditions: [ModelRequest, EnvironmentProof]
    exit_conditions: [DEPLOYMENT_READY, TRIAGE_READY, PATCH_PLACED, NEEDS_HUMAN]
    rules:
      - capture the smallest failing request and actual dispatch path before changing code
      - classify missing, bypassed, unlaunchable, wrong, runtime-state, and API failures separately
      - use a reversible workaround and re-run the integrated serving path before claiming progress
      - clear the runtime-drift gate and the toy bring-up before the first real load; both run without weights and between them they hold most of what a first launch would have found
      - measure the loop before entering it — when one iteration costs a full weight load, build the cheap reproduction first instead of paying per bug
      - record each fact in the Journal as it is established, not at the end; the one durable finding here (a version-labelled engine that had moved past the plugin) was written down only after eight discoveries had already paid for it
      - report progress on a fixed cadence during long waits and keep the wait in the background; silence during a load reads as no progress and invites interruption
  - id: kernel-grade
    task_types: [platform_kernel_correctness, end_to_end_accuracy,
                 long_context_sparse_correctness]
    purpose: grade an operator or served distribution against an independent reference
    tools: [capability_evaluation, accuracy_differential]
    verification: correctness_validator
    preconditions: [CapabilityMatch, DeploymentProof]
    exit_conditions: [PASS, FAIL, AMBIGUOUS, NEEDS_HUMAN]
    rules:
      - require relative L2, elementwise error, and NaN/Inf counts
      - require reference provenance and a negative control that misses the gate
      - report AMBIGUOUS when the tested geometry cannot distinguish conventions
