api_version: infer.kunlun/v1alpha1
kind: Workflow
metadata:
  name: model_adaptation
spec:
  description: Evidence-driven model adaptation for vLLM-Kunlun.
  entry_task: mat-001-model-intake
  nodes:
    - id: mat-001-model-intake
      task: tasks/mat-001-model-intake/task.yaml
      on_success: mat-002-model-scan
    - id: mat-002-model-scan
      task: tasks/mat-002-model-scan/task.yaml
      on_success: kdp-001-deployment-proof
    - id: kdp-001-deployment-proof
      task: tasks/kdp-001-deployment-proof/task.yaml
      on_success: NEEDS_HUMAN
      on_failure: REWORK
  notes:
    - Static scan precedes any source patching.
    - Deployment readiness is a hard gate for runtime adaptation.
    - Gap classification and patch tasks will be added only with validators.
