api_version: infer.kunlun/v1alpha1
kind: Workflow
metadata:
  name: model_adaptation
spec:
  description: Evidence-driven model adaptation for vLLM-Kunlun.
  entry_task: mat-001-model-intake
  nodes:
    # Cheapest gate first. Intake reads the PVC with no XPU and stops a wrong
    # directory — an mcore training checkpoint under a model-like name — before
    # eight cards are ever requested.
    - id: mat-001-model-intake
      task: tasks/mat-001-model-intake/task.yaml
      on_success: kdp-001a-environment-proof
      on_failure: NEEDS_HUMAN
    # Deploy the pod and the stack before deciding anything about the model. This
    # proves the base environment and produces the pod that the scan runs inside,
    # which is why no separate throwaway pod is needed from here on.
    - id: kdp-001a-environment-proof
      task: tasks/kdp-001a-environment-proof/task.yaml
      on_success: mat-002-model-scan
      on_failure: NEEDS_HUMAN
    # Scanning the installed runtime, not a checkout: what is registered here is
    # what will actually run.
    - id: mat-002-model-scan
      task: tasks/mat-002-model-scan/task.yaml
      on_success: mat-003-capability-match
      on_failure: NEEDS_HUMAN
    # Static only: it can say a requirement is missing, never that the model
    # runs. Its MATCHED verdict on Qwen3-8B coexists with a failing server.
    - id: mat-003-capability-match
      task: tasks/mat-003-capability-match/task.yaml
      on_success: mat-004-gap-classification
      on_failure: NEEDS_HUMAN
    # Offline: it reads two static findings and routes. NO_STATIC_GAP means the
    # remaining question can only be answered by deploying.
    - id: mat-004-gap-classification
      task: tasks/mat-004-gap-classification/task.yaml
      on_success: mat-024-operator-task-dispatch
      on_failure: NEEDS_HUMAN
    # Operator generation is asynchronous. Durable requests are emitted here,
    # while the main Agent continues bring-up with a reversible fallback.
    - id: mat-024-operator-task-dispatch
      task: tasks/mat-024-operator-task-dispatch/task.yaml
      on_success: mat-008-capability-evaluation
      on_failure: mat-008-capability-evaluation
    # The first node whose width depends on an upstream artifact: it fans out over
    # exactly the dimensions the CapabilityMatch says this model demands. Placed
    # before the deployment plan because a capability that is numerically wrong at
    # one layer will not become right at eight cards, and this costs one pod-exec.
    - id: mat-008-capability-evaluation
      task: tasks/mat-008-capability-evaluation/task.yaml
      on_success: mat-005-deployment-plan
      # A dimension that computes the wrong numbers is a triage input, not a stop.
      on_failure: mat-006-failure-triage
    # Derives the launch parameters that used to be typed by hand, each with the
    # upstream fact it came from.
    - id: mat-005-deployment-plan
      task: tasks/mat-005-deployment-plan/task.yaml
      on_success: kdp-001b-service-proof
      on_failure: NEEDS_HUMAN
    - id: kdp-001b-service-proof
      task: tasks/kdp-001b-service-proof/task.yaml
      on_success: mat-013-accuracy-differential
      # A start failure is an input to triage, not the end of the graph. This
      # edge is the one that used to be a dead end.
      on_failure: mat-006-failure-triage
    # Attribution, not repair: it decides which of the four layers owns the
    # failure and whether a workaround is possible. Qwen3-8B's first pass landed
    # on RUNTIME_STATE_DEPENDENT — both vendor decode kernels fail in the server
    # and accept identical arguments outside it.
    - id: mat-006-failure-triage
      task: tasks/mat-006-failure-triage/task.yaml
      on_success: mat-007-patch-placement
      # A binary-layer verdict has nowhere else to go, and that is a delivery.
      on_failure: mat-020-vendor-handoff
    # Where a fix is allowed to live. patches/torch_paged_decode.py is the first
    # one; it still needs a placement decision among the four override mechanisms
    # and a numerical comparison against the vendor kernel.
    - id: mat-007-patch-placement
      task: tasks/mat-007-patch-placement/task.yaml
      on_success: kdp-001b-service-proof
      on_failure: NEEDS_HUMAN
    # Read-only and downstream of a successful service proof. Kept out of
    # KDP-001b because a capacity threshold must not be able to fail a
    # deployment that is, in fact, serving.
    # Correctness before capacity: a wrong kernel produces fluent text, so the
    # differential runs before anything is claimed about the deployment.
    - id: mat-013-accuracy-differential
      task: tasks/mat-013-accuracy-differential/task.yaml
      on_success: mat-025-baseline-freeze
      on_failure: mat-006-failure-triage
    # A candidate must be tested against this immutable working baseline.
    - id: mat-025-baseline-freeze
      task: tasks/mat-025-baseline-freeze/task.yaml
      on_success: mat-026-operator-candidate-integration
      on_failure: mat-006-failure-triage
    # With no candidate yet this records WAITING_FOR_CANDIDATE and allows the
    # original serving flow to finish. A later run can provide one candidate.
    - id: mat-026-operator-candidate-integration
      task: tasks/mat-026-operator-candidate-integration/task.yaml
      on_success: mem-001-memory-budget
      on_failure: mem-001-memory-budget
    - id: mem-001-memory-budget
      task: tasks/mem-001-memory-budget/task.yaml
      on_success: mat-009-api-conformance
      on_failure: mat-009-api-conformance
    # Its own family: the numbers can be right and the response still wrong, with
    # reasoning_content empty or tool_calls unparsed. Both edges lead to the matrix
    # for the same reason mem-001's do — the matrix records what the evidence supports
    # and refuses to over-claim, so a parser defect belongs in it rather than blocking it.
    - id: mat-009-api-conformance
      task: tasks/mat-009-api-conformance/task.yaml
      on_success: mat-016-support-matrix
      on_failure: mat-016-support-matrix
    # Writes the only artifact people read instead of the evidence, so it runs last
    # and refuses to claim more than the recorded facts support.
    - id: mat-016-support-matrix
      task: tasks/mat-016-support-matrix/task.yaml
      on_success: DELIVERED
      on_failure: NEEDS_HUMAN
    # Terminal, not a failure: the deliverable is a ticket someone else can act on.
    - id: mat-020-vendor-handoff
      task: tasks/mat-020-vendor-handoff/task.yaml
      on_success: DELIVERED
      on_failure: NEEDS_HUMAN
  notes:
    - Intake keeps its own XPU-free probe Pod; every later in-pod inspection reuses
      the environment proof's pod.
    - The environment half is provable without launch parameters, so the scan runs
      before any parameter is chosen.
    - Nodes marked PLANNED have no validator yet and must not be claimed as
      capabilities.
