api_version: infer.kunlun/v1alpha1
kind: Workflow
metadata:
  name: model_adaptation
spec:
  description: Evidence-driven model adaptation for vLLM-Kunlun.
  entry_task: mat-001-model-intake
  nodes:
    # Cheapest gate first. Intake reads the PVC with no XPU and stops a wrong
    # directory — an mcore training checkpoint under a model-like name — before
    # eight cards are ever requested.
    - id: mat-001-model-intake
      task: tasks/mat-001-model-intake/task.yaml
      on_success: kdp-001a-environment-proof
      on_failure: NEEDS_HUMAN
    # Deploy the pod and the stack before deciding anything about the model. This
    # proves the base environment and produces the pod that the scan runs inside,
    # which is why no separate throwaway pod is needed from here on.
    - id: kdp-001a-environment-proof
      task: tasks/kdp-001a-environment-proof/task.yaml
      on_success: mat-002-model-scan
      on_failure: NEEDS_HUMAN
    # Scanning the installed runtime, not a checkout: what is registered here is
    # what will actually run.
    - id: mat-002-model-scan
      task: tasks/mat-002-model-scan/task.yaml
      on_success: mat-003-capability-match
      on_failure: NEEDS_HUMAN
    # Static only: it can say a requirement is missing, never that the model
    # runs. Its MATCHED verdict on Qwen3-8B coexists with a failing server.
    - id: mat-003-capability-match
      task: tasks/mat-003-capability-match/task.yaml
      on_success: mat-004-gap-classification
      on_failure: NEEDS_HUMAN
    - id: mat-004-gap-classification
      task: PLANNED
      on_success: mat-005-deployment-plan
    - id: mat-005-deployment-plan
      task: PLANNED
      on_success: kdp-001b-service-proof
    - id: kdp-001b-service-proof
      task: tasks/kdp-001b-service-proof/task.yaml
      on_success: NEEDS_HUMAN
      # A start failure is an input to triage, not the end of the graph. This
      # edge is the one that used to be a dead end.
      on_failure: mat-006-failure-triage
    # Attribution, not repair: it decides which of the four layers owns the
    # failure and whether a workaround is possible. Qwen3-8B's first pass landed
    # on RUNTIME_STATE_DEPENDENT — both vendor decode kernels fail in the server
    # and accept identical arguments outside it.
    - id: mat-006-failure-triage
      task: tasks/mat-006-failure-triage/task.yaml
      on_success: mat-007-patch-placement
      on_failure: NEEDS_HUMAN
    # Where a fix is allowed to live. patches/torch_paged_decode.py is the first
    # one; it still needs a placement decision among the four override mechanisms
    # and a numerical comparison against the vendor kernel.
    - id: mat-007-patch-placement
      task: PLANNED
      on_success: kdp-001b-service-proof
  notes:
    - Intake keeps its own XPU-free probe Pod; every later in-pod inspection reuses
      the environment proof's pod.
    - The environment half is provable without launch parameters, so the scan runs
      before any parameter is chosen.
    - Nodes marked PLANNED have no validator yet and must not be claimed as
      capabilities.
