api_version: infer.kunlun/v1alpha1
kind: Workflow
metadata:
  name: performance_optimization
spec:
  # 流程骨架:所有节点为 task: PLANNED,Graph Runner 会以 NO_CONTRACT 停止,
  # 不可执行。转正条件与守卫同 performance_analysis.yaml 头部注释。
  description: Baseline, profile, candidate validation, and evidence-driven performance loop.
  entry_task: perf-101-baseline
  nodes:
    - id: perf-101-baseline
      task: PLANNED  # 目标:固定矩阵基线采集契约
      on_success: perf-102-profile
      on_failure: NEEDS_HUMAN
    - id: perf-102-profile
      task: PLANNED  # 目标:profiler 捕获契约
      on_success: perf-103-candidate-validation
      on_failure: NEEDS_HUMAN
    - id: perf-103-candidate-validation
      task: PLANNED  # 目标:候选优化的正确性 + benchmark 回归契约
      on_success: perf-104-performance-gate
      on_failure: NEEDS_HUMAN
    - id: perf-104-performance-gate
      task: PLANNED  # 目标:promote/rollback 判定与证据发布
      on_success: DELIVERED
      on_failure: NEEDS_HUMAN
