[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infer-forge-harness"
version = "0.1.0"
description = "Agentic harness for inference model bring-up, validation, and optimization"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[project.scripts]
run-adaptation = "cli.adaptation:main"

[tool.setuptools.packages.find]
include = [
    "core*",
    "adapters*",
    "runtimes*",
    "engine*",
    "runners*",
    "tools*",
    "validators*",
    "operations*",
    "cli*",
]

[tool.setuptools.package-data]
runtimes = ["scripts/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "local_e2e: required capability scenarios with simulated external boundaries",
    "device_smoke: opt-in prepared-device smoke with real environment evidence",
    "real_model: opt-in real-model service and accuracy regression",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
