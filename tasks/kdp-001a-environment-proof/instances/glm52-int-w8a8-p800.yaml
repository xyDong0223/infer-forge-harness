api_version: infer.kunlun/v1alpha1
kind: Task
metadata:
  name: kdp-001a-glm52-environment-proof
  task_type: environment_proof
  version: 0.1.0
  owner: dongxinyu03

# The environment half of the deployment proof for the GLM5.2-Int-W8A8
# adaptation run. The stack is proven with the cluster profile's known-good
# base model (MiniMax-M2.5-Int8-W8A8), not with the 707 GiB target: an
# environment failure must not cost a target-model load, and a target-model
# failure must not be attributable to the install. task_runner fills in the
# base model, target, serve command, and checks from
# config/clusters/p800-cluster.yaml at execution time.

context:
  model:
    name: GLM5.2-Int-W8A8
    path: /mnt/cluster/GLM-5.2-W8A8-INT8-Dynamic
    pvc: rapidfs-baige-v3-pvc
  target:
    hardware: Kunlunxin-3-P800
    device_count: 8
    namespace: pd-test

actions:
  - preflight
  - prepare_environment
  - verify_runtime_importable
  - discover_base_model
  - start_base_model
  - run_base_prefill_decode_smoke
  - verify_base_service
  - collect_environment_fingerprint

acceptance:
  pod_ready: true
  runtime_importable: true
  code_ready: true
  device_ready: true
  base_model_loaded: true
  base_prefill: true
  base_decode: true
  base_health_check: 200
  base_chat_completion: non_empty
  unexpected_fallback: false

execution:
  mode: execute
  namespace: pd-test
  resource_name: dongxinyu03-environment-base
  manifest: config/manifests/p800-vllm-kunlun.yaml
  startup_timeout_seconds: 1800
  retain_on_failure: true
  commands:
    install:
      - bash /workspace/install_vllm_kunlun.sh

checks:
  health:
    path: /health
    expected_status: 200
  chat:
    path: /v1/chat/completions
    method: POST
    expected_non_empty_text: true
    payload:
      model: minimax-base-smoke
      messages:
        - role: user
          content: Say hello in one short sentence.
      max_tokens: 16
  backend:
    expected: kunlun
    reject_unexpected_fallback: true

artifacts:
  directory: /ssd1/dongxinyu03/kunlun-agent-artifacts/glm52-int-w8a8-p800/environment-proof
  collect:
    - deployment_manifest
    - runtime_import
    - environment_fingerprint
    - base_model_identity
    - base_server_log
    - base_health_result
    - base_chat_result

exit_states:
  pass: ENVIRONMENT_READY
  runtime_drift: RUNTIME_DRIFT
  install_failed: INSTALL_FAILED
  pod_timeout: READINESS_TIMEOUT
  needs_human: NEEDS_HUMAN
