api_version: infer.kunlun/v1alpha1
kind: Task
metadata:
  name: kdp-001b-service-proof
  family: deployment
  task_type: service_proof
  version: 0.1.0
spec:
  question: does this model serve on this proven environment
  produces: DeploymentProof
  # The launch parameters come from the deployment plan, not from a guess here;
  # the pod comes from the environment proof. Both are imported, and this Task
  # refuses to create a pod of its own — doing so would reinstall the runtime and
  # invalidate the environment proof it is supposed to build on.
  consumes: [EnvironmentProof, DeploymentPlan]
  runs_with: |
    python3 cli/deployment/proof.py \
      <DeploymentPlan artifact_root>/kdp_instance.yaml --execute --phase service \
      --attach-pod <pod from the environment proof's status.json>
context:
  model:
    name: ${MODEL_NAME}
    path: ${MODEL_PATH}
  target:
    hardware: Kunlunxin-3-P800
    namespace: ${KUNLUN_NAMESPACE}
actions:
  - toy_bringup_before_load
  - start_server
  - poll_health
  - run_chat_smoke
  - verify_backend
  - collect_artifacts
acceptance:
  health_check: 200
  chat_completion: non_empty
  expected_backend: kunlun
  unexpected_fallback: false
artifacts:
  - server_log
  - health_result
  - chat_result
  - reproduce_command
exit_states:
  input_required: INPUT_REQUIRED
  contract_invalid: CONTRACT_INVALID
  blocked: BLOCKED
  runtime_drift: RUNTIME_DRIFT
  pass: DEPLOYMENT_READY
  bringup_blocked: BRINGUP_BLOCKED
  startup_failed: SERVER_START_FAILED
  health_timeout: READINESS_TIMEOUT
  api_failed: API_SMOKE_FAILED
  fallback_detected: UNEXPECTED_FALLBACK
  needs_human: NEEDS_HUMAN
validator: validators/deployment_validator.py:validate_deployment_status
