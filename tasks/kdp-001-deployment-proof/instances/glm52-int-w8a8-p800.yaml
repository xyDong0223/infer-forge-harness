api_version: infer.kunlun/v1alpha1
kind: Task
metadata:
  name: kdp-001-glm52-int-w8a8-p800
  task_type: deployment_proof
  version: 0.1.0
  owner: dongxinyu03

context:
  model:
    name: GLM5.2-Int-W8A8
    # 744B MoE + MLA + DSA indexer + MTP, INT8 dynamic W8A8 weights (707 GiB).
    path: /mnt/cluster/GLM-5.2-W8A8-INT8-Dynamic
    pvc: rapidfs-baige-v3-pvc
  target:
    hardware: Kunlunxin-3-P800
    # 8 x 96 GiB = 768 GiB total; weights alone are 707 GiB, so every other
    # memory consumer is tight by necessity, not by choice.
    device_count: 8
    namespace: pd-test
    volcano_queue: aihcq-8vcrxly8ieyn
    dedicated_pool: aihcq-sirzhpwo0g1u
  runtime:
    engine: vllm
    backend: kunlun
    plugin: vllm-kunlun
  repository:
    vllm_kunlun_ref: v0.25.1-dev
  software:
    install_guide: https://github.com/baidu/vLLM-Kunlun/blob/v0.25.1-dev/docs/source/installation.md
    image: iregistry.baidu-int.com/hac_test/aiak-inference-llm:vLLM-Kunlun-Base
    vllm_version: 0.25.1
    torch_version: 2.9.0
  server:
    host: 0.0.0.0
    port: 8356
    served_model_name: GLM5.2-Int-W8A8
    tensor_parallel_size: 8
    # Bring-up conservative: the config allows 1M, but the first service proof
    # only has to prove the path; length comes after correctness.
    max_model_len: 32768
    dtype: float16

actions:
  - preflight
  - prepare_environment
  - toy_bringup_before_load
  - start_server
  - poll_health
  - run_chat_smoke
  - collect_artifacts

acceptance:
  pod_ready: true
  health_check: 200
  chat_completion: non_empty
  expected_backend: kunlun
  unexpected_fallback: false
  startup_timeout_seconds: 3600

execution:
  mode: plan_only
  namespace: pd-test
  resource_name: dongxinyu03-kdp001-glm52-int-w8a8
  manifest: tasks/kdp-001-deployment-proof/manifests/feddeployment.template.yaml
  # 707 GiB of INT8 weights over 8 XPUs loads far slower than MiniMax's 215 GiB.
  startup_timeout_seconds: 3600
  health_interval_seconds: 15
  health_successes_required: 3
  retain_on_failure: true
  server_log: /workspace/server_glm52.log
  commands:
    install:
      - bash /workspace/install_vllm_kunlun.sh
    setup:
      # Same Kunlun/XMLIR tuning flags as the validated MiniMax launch: both
      # models are INT8-dynamic-quantized MoE on 8 XPUs.
      - source /workspace/vLLM-Kunlun/setup_env.sh
      - export XPU_USE_MOE_SORTED_THRES=1
      - export XFT_USE_FAST_SWIGLU=1
      - export XPU_USE_FAST_SWIGLU=1
      - export XMLIR_CUDNN_ENABLED=1
      - export XPU_USE_DEFAULT_CTX=1
      - export XMLIR_FORCE_USE_XPU_GRAPH=1
      - export XMLIR_ENABLE_MOCK_TORCH_COMPILE=false
      - export XMLIR_DYNAMO_WORKAROUND=1
      - export VLLM_HOST_IP=$(hostname -i)
    serve:
      - >-
        python -m vllm.entrypoints.openai.api_server
        --host 0.0.0.0
        --port 8356
        --model /mnt/cluster/GLM-5.2-W8A8-INT8-Dynamic
        --gpu-memory-utilization 0.95
        --max-model-len 32768
        --max-num-batched-tokens 8192
        --trust-remote-code
        --tensor-parallel-size 8
        --dtype float16
        --max-num-seqs 64
        --block-size 128
        --served-model-name GLM5.2-Int-W8A8

checks:
  health:
    path: /health
    expected_status: 200
  chat:
    path: /v1/chat/completions
    method: POST
    expected_non_empty_text: true
    payload:
      model: GLM5.2-Int-W8A8
      messages:
        - role: user
          content: Say hello in one short sentence.
      max_tokens: 32
  backend:
    expected: kunlun
    reject_unexpected_fallback: true

artifacts:
  directory: /ssd1/dongxinyu03/kunlun-agent-artifacts/glm52-int-w8a8-p800
  collect:
    - deployment_manifest
    - task_contract
    - pod_spec
    - environment_versions
    - install_log
    - server_log
    - health_result
    - chat_result
    - reproduce_command

exit_states:
  pass: DEPLOYMENT_READY
  install_failed: INSTALL_FAILED
  bringup_blocked: BRINGUP_BLOCKED
  startup_failed: SERVER_START_FAILED
  health_timeout: READINESS_TIMEOUT
  api_failed: API_SMOKE_FAILED
  fallback_detected: UNEXPECTED_FALLBACK
  invalid: CONTRACT_INVALID
  needs_human: NEEDS_HUMAN
