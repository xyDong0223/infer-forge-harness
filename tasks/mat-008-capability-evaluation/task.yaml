api_version: infer.kunlun/v1alpha1
kind: Task
metadata:
  name: mat-008-capability-evaluation
  family: model_adaptation
  task_type: capability_evaluation
  version: 0.1.0
spec:
  question: does the capability actually run on this hardware, and are its numbers right
  produces: CapabilityEvaluation
  consumes: [CapabilityMatch, EnvironmentProof]
  # MAT-003 can only grade static evidence, and its top grade is not support:
  # Qwen3-8B matched every axis and still died in a decode kernel. This Task adds
  # the tier above REGISTRY — EXERCISED — by running the capability and comparing
  # it to a reference that does not share the accelerator.
  parameterized_by: dimension
  fan_out: |
    python3 tools/evaluate_capability.py --list-dimensions \
      --capability-match <artifacts>/mat-003/capability_match.json
  runs_with: |
    python3 tools/evaluate_capability.py --dimension <dimension> --subject <subject> \
      --pod <pod> --model-path <weights> --out <artifacts>/mat-008/<dimension>
  fan_in: |
    python3 tools/evaluate_capability.py --aggregate --out <artifacts>/mat-008 \
      --child <artifacts>/mat-008/<dimension> ...
context:
  target:
    hardware: Kunlunxin-3-P800
  # One contract, four dimensions. The method does not change per dimension —
  # smallest unit that still carries the convention risk, the operators the serving
  # path uses, a float32 reference off the accelerator, and a control — so four
  # near-identical contracts would only drift apart.
  dimensions_declared: [quantization, msa, moe, block_sparse, multimodal]
execution:
  mode: execute
  tool: tools/evaluate_capability.py
  probes:
    quantization: tools/probe/quantized_linear_probe.py
    msa: tools/probe/sliding_window_decode_probe.py
    moe: tools/probe/moe_layer_probe.py
    block_sparse: tools/probe/block_sparse_attention_probe.py
  reference:
    implementation: torch
    device: cpu
    dtype: float32
    # Unlike MAT-013, the probe process must see the accelerator — the candidate is
    # an operator on it. What must stay off the accelerator is the *reference
    # computation*, which is why every probe here computes it on the CPU in float32.
    must_not_see_accelerator: false
actions:
  - select_dimensions_from_capability_match
  - exercise_dimension
  - compare_against_float32_reference
  - run_negative_control
  - aggregate_dimensions
checks:
  method:
    unit: the smallest unit that still carries the convention risk, not a whole model
    require_negative_control: true
    # Learned the hard way: cosine similarity is invariant to a uniform per-channel
    # factor, which is exactly what the W8A8 scale-to-max conversion is. The wrong
    # answer scored 0.9999999. Magnitude has to be in the gate.
    gate_metric: relative_l2
    forbid_cosine_only_gate: true
  dimensions:
    quantization:
      # W8A8 int8, per-channel weights, per-token dynamic activations. The line under
      # test is quantization/kernels/scale_mm.py:50 `w_s.mul_(127.0)`: upstream
      # compressed-tensors stores a scale, the Kunlun matmul wants a max. Omitting it
      # is the negative control.
      operators: [_C::scaled_int8_quant, _C::matmul]
      # `auto` discovers the first quantized layer-0 linear from the checkpoint index.
      # A fixed name is model-specific in a way that fails silently: MiniMax-M2.5 has
      # model.layers.0.self_attn.q_proj while the M3 checkpoint nests the language
      # model, so the same layer is language_model.model.layers.0.self_attn.q_proj.
      tensor: auto
      tokens: 17
      min_cosine: 0.9999
      # The reference reuses the candidate's own quantized activations, so what is
      # left is bfloat16 output rounding and accumulation order — measured at 0.0017
      # on P800, gated at 0.01.
      max_relative_l2: 0.01
      control: pass w_pc_max=w_s, i.e. without the scale-to-max conversion
    msa:
      operators: [kunlun_ops.speculative_attention, patches/torch_paged_decode.py]
      # Sliding window is not a separate operator on this platform: 413 symbols in
      # kunlun_ops contain no window match. It is a parameter — swa_left/swa_right in
      # prefill, max_window_size in decode — so the work is window semantics in the
      # torch reference, not a new kernel.
      geometry:
        # Qwen3-8B's own attention shape, at a context deliberately longer than the
        # window: if context_len <= window the windowed and unwindowed computations
        # are identical and the probe would pass while measuring nothing.
        heads: 32
        kv_heads: 8
        head_dim: 128
        block_size: 16
        batch: 4
        context_len: 96
        window: 32
      min_cosine: 0.9999
      max_relative_l2: 0.01
      control: run the same fallback with max_window_size=-1, i.e. full attention
      # Measured on 2026-09-08 at three geometries (block_size 16/64, context
      # 96/512/1024, window 8/32/128/256): kunlun_ops.speculative_attention matches an
      # *unwindowed* float32 reference to bf16 precision (relative L2 0.0017) and is
      # 0.80 away from the windowed one. It ignores max_window_size. The probe records
      # this as `ignores_window` rather than gating on it, because it is a fact about
      # the vendor kernel and not a defect in the patch.
      vendor_note: speculative_attention ignores max_window_size at every geometry tested
    moe:
      # TP first; EP is a Python per-expert loop and a later addition.
      operators: [_C::moe_softmax_topk_norm, _C::moe_fc, _C::silu_and_mul, _C::moe_post,
                  _C::moe_pre_sorted, xspeedgate_ops::moe_pre_small]
      geometry:
        # Two batches, one on each side of fused_moe's M*top_k > 768 preprocessing
        # switch: above it _C::moe_pre_sorted, below it xspeedgate_ops::moe_pre_small.
        # Two implementations of the same step is two chances to disagree, and nothing
        # else here checks that they agree.
        #
        # 128 experts and top-4 are MiniMax-M3's real routing shape. hidden and
        # intermediate stay small: the expert count is what changes the routing and the
        # preprocessing, while widening the GEMMs only costs time.
        experts: 128
        hidden: 512
        intermediate: 256
        top_k: 4
        tokens_below: 16
        tokens_above: 512
        # M3 declares no expert groups, so sigmoid routing is exercised ungrouped.
        n_group: 1
        topk_group: 1
      min_cosine: 0.9999
      # Looser than the quantization dimension on purpose: a MoE forward is two
      # bfloat16 GEMMs plus a bfloat16 activation and weighted sum, all through
      # bfloat16 workspaces. Measured 0.0096 / 0.0094 on the two sides of the threshold
      # at 128 experts and top-4.
      max_relative_l2: 0.02
      control: compare against a reference that routes to the bottom-k experts
      # Sigmoid + bias routing is what MiniMax-M3 and DeepSeek-V3 use, and it is a
      # separate question from the SwiGLU arithmetic. Measured 2026-09-08: selection is
      # by sigmoid(logits) + bias, and the returned weights are the *bias-free* sigmoid
      # scores renormalised over the selected experts (agreement 6e-8; the
      # bias-included formula is 0.065 away, so the difference is not rounding).
      routing_semantics: sigmoid_plus_bias_selects_bias_free_weights
      # A blocker, not a threshold: KunlunOps.fused_moe's scoring_func="sigmoid" branch
      # cannot run on this build. It passes block_static= into
      # _C::moe_sigmoid_group_topk_norm, whose impl forwards that name to a vendor
      # binding whose parameter is block_statistic — a TypeError before any arithmetic.
      # Affects sigmoid-routed MoE models quantized and not; the operator itself is
      # correct when called with the right keyword.
      known_blockers:
        - vllm_kunlun/ops/_kunlun_ops.py:426 and compressed_tensors_moe.py:193 pass
          block_static= where the vendor binding expects block_statistic=
      # An exact tie between the k-th and (k+1)-th expert is not evidence about
      # arithmetic — the kernel and torch.topk are both right and break it
      # differently. One tied token moved a 384-token batch from 0.009 to 0.031, so the
      # probe reports ties and excludes those tokens.
      router_ties: excluded_and_counted
    block_sparse:
      # MiniMax-M3's MSA path. Upstream implements it in triton, shared by the nvidia
      # and amd variants, so it has no execution path here — but the vendor library
      # already ships all three kernels, unused by the plugin. Unused means their
      # conventions are documented and unverified, and wiring a model against an
      # unverified kernel yields a service that runs and is wrong.
      operators: [kunlun_ops::msa_block_score, kunlun_ops::msa_block_score_topk_transform,
                  kunlun_ops::msa_sparse_attention]
      geometry:
        # Two geometries, because the path has two stages against two caches: the
        # lightning indexer scores against a single-head index cache, then the main
        # heads attend against the paged K/V cache. Upstream sets num_idx_heads ==
        # num_kv_heads, so index_heads doubles as the main kv head count.
        index_heads: 4
        heads: 16
        head_dim: 128
        page_size: 64
        block_size: 64
        batch: 2
        context_len: 512
        # Must stay below context_len / block_size, or every block is selected and
        # sparse attention is dense attention — the gate would then pass for free.
        topk: 4
      min_cosine: 0.9999
      # Measured 2026-09-08: block scores 3.7e-4, sparse attention 1.6e-3 against the
      # same selected blocks, while the same output is 0.99 away from dense attention.
      max_relative_l2: 0.02
      control: grade the kernel against attention over a block set shifted by one
      # Measured conventions, each of which silently changes the answer if assumed:
      conventions:
        # tl.max(qk, axis=1) upstream, and the scale is applied here even though
        # upstream's decode kernel drops it (ordering is scale-invariant, so both are
        # correct and only one matches numerically).
        block_score_reduction: max_over_block_of_scaled_qk
        # 0.375 of rows matched a plain top-k; reserving the local block matched all of
        # them. Without it the selected set is wrong in most rows.
        topk_reserves_local_block: true
        # The kernels are token-major, upstream's triton is head-major. A transpose is
        # part of the port, not an optimisation.
        topk_idx_layout: total_q_heads_topk
        index_cache_kv_heads: 1
        head_dim_v: must_be_passed_explicitly
      known_blockers:
        - msa_block_score accepts head_num_kv == 1 only; any other value returns
          ret=1 before any arithmetic, so the index cache has to be single-head
        - msa_block_score's optional attention output stays all-zero at score_type=0,
          so the fused "scores plus attention" form advertised in its docstring is not
          available on this build
    multimodal:
      operators: []
      min_cosine: 0.9999
      max_relative_l2: 0.02
acceptance:
  require_threshold_source: true
  require_negative_control: true
  # A dimension nobody ran must not read as one that passed.
  forbid_unimplemented_as_exercised: true
artifacts:
  - capability_evaluation.json
  - capability_evaluation_table.md
  - evaluation_status.json
exit_states:
  pass: EVALUATION_PASS
  partial: EVALUATION_PARTIAL
  fail: EVALUATION_FAIL
  unavailable: NEEDS_HUMAN
  invalid: CONTRACT_INVALID
validator: validators/evaluation_validator.py:validate_evaluation
limitations:
  - EXERCISED covers one layer under one shape. It says the operators compute the
    right thing there, not that a deployment serves — KDP-001b and MAT-013 still own
    that claim.
  - Only the quantization, msa, moe and block_sparse dimensions have probes.
    multimodal reports EVALUATION_UNIMPLEMENTED, which is a fact about this repo and
    not a verdict about the platform.
  - The moe dimension covers the tensor-parallel path only. fused_moe_ep is a separate
    call and is not exercised, so nothing here says anything about expert parallel.
  - The moe dimension uses synthetic bfloat16 experts, which keeps it independent of
    the quantization dimension. An int8 MoE layer is a different path
    (compressed_tensors_moe.py) and is not covered.
  - The msa dimension exercises decode only. Prefill takes the window through
    swa_left/swa_right on a different call and is not covered here.
  - The block_sparse dimension also exercises decode only, and it verifies the three
    kernels in isolation against synthetic caches. It says nothing about the index
    cache being *written* correctly — that belongs to the fused qk-norm/RoPE/insert op
    — and nothing about M3's own layer wiring.
  - The quantization weights may differ from the subject's. A dense bf16 model has no
    quantized layer to exercise, so the dimension is only selected when the
    CapabilityMatch says the model demands it.
