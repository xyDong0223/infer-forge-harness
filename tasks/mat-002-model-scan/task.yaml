api_version: infer.kunlun/v1alpha1
kind: Task
metadata:
  name: mat-002-model-scan
  family: model_adaptation
  task_type: model_scan
  version: 0.3.0
spec:
  question: which implementation will actually run this architecture on this hardware, and if none, where does one exist
  produces: ModelSupportCard
  # The pod comes from the environment proof, the identity from intake. This Task
  # creates nothing and needs no launch parameter.
  consumes: [ModelRequest, EnvironmentProof]
  runs_with: |
    python3 tools/scan_model_support.py \
      --model-request <artifacts>/mat-001/model_request.yaml \
      --env-status <artifacts>/kdp-001a/status.json \
      --out <artifacts>/mat-002
context:
  input_artifacts:
    - model_request.yaml
    - environment proof status.json
  target:
    hardware: Kunlunxin-3-P800
execution:
  mode: execute
  # Scans the installed runtime, not a checkout: vLLM-Kunlun can override models
  # four different ways (module redirection, post-import patching, OOT
  # registration, install-time overwrite), so a repository and an installation
  # can disagree about what is registered.
  scope: installed_runtime
  probe: tools/probe/model_support_probe.py
  tool: tools/scan_model_support.py
  # The pod reaches GitHub through the same proxy the operator host uses, so the
  # upstream lookups run where the registry evidence is gathered.
  upstream_lookup:
    - installed vllm_kunlun OOT registry
    - installed vllm ModelRegistry
    - vLLM main branch registry.py
    - open vLLM pull requests
actions:
  - read_model_request
  - scan_installed_registries
  - escalate_to_upstream_main
  - escalate_to_open_pull_requests
  - package_support_card
checks:
  verdicts:
    # Six answers, not two. An architecture missing from the Kunlun registry is
    # usually not a gap — the upstream generic implementation is used, and a
    # failure then belongs to an operator, not to networking. But "resolves" is
    # also not "implemented for us": upstream ships some models once per
    # accelerator, and the variant selected here can be written for other hardware.
    - KUNLUN_OOT
    - UPSTREAM_GENERIC
    - UPSTREAM_VENDORED_VARIANT
    - MAIN_ONLY
    - PR_PENDING
    - ABSENT
  backend_variant:
    # Added after MiniMax-M3, where the scan said the architecture resolves and the
    # flow went to deployment, then hit four walls one launch at a time — all of
    # them inside vllm/models/minimax_m3/nvidia, selected because vLLM-Kunlun
    # answers False to every platform predicate upstream tests.
    inspect: the module the registry actually resolves to
    record:
      - whether sibling per-backend variants exist
      - which variant this platform selects
      - that variant's imports that do not import here
      - that variant's custom ops that are not registered here
    verdict_when_unmet: UPSTREAM_VENDORED_VARIANT
  unreachable_upstream:
    # Absence can only be concluded from lookups that ran.
    verdict: UNKNOWN_UPSTREAM
    never_downgrade_to: ABSENT
acceptance:
  required_fields:
    - architecture
    - verdict
    - meaning
  require_installed_registry_evidence: true
  evidence_required: true
artifacts:
  - model_support.json
  - model_support_card.md
  - scan_status.json
exit_states:
  pass: SCAN_READY
  scan_failed: SCAN_FAILED
  invalid: CONTRACT_INVALID
  needs_human: NEEDS_HUMAN
validator: validators/scan_validator.py:validate_support_card
